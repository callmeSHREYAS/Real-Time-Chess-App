events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream pvp_backend {
        zone pvp_backend 64k;
        least_conn;
        server game-server-1:3001 resolve max_fails=2 fail_timeout=10s;
        server game-server-2:3002 resolve max_fails=2 fail_timeout=10s;
        server game-server-3:3003 resolve max_fails=2 fail_timeout=10s;
    }

    server {
        listen 3000;

        location = /healthz {
            proxy_pass http://pvp_backend/healthz;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /socket.io/ {
            proxy_pass http://pvp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            proxy_pass http://pvp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
