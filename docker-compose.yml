x-pvp-common-env: &pvp-common-env
  REDIS_URL: redis://redis:6379
  DATABASE_URL: postgres://chess:chess@postgres:5432/chess
  PVP_GAME_SERVERS: '[{"id":"game-01","url":"http://localhost:3001"},{"id":"game-02","url":"http://localhost:3002"},{"id":"game-03","url":"http://localhost:3003"},{"id":"game-04","url":"http://localhost:3004"},{"id":"game-05","url":"http://localhost:3005"}]'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PVPServices/Models/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  game-server-1:
    build: .
    environment:
      <<: *pvp-common-env
      PVP_SERVER_ID: game-01
      PVP_PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://chess:chess@postgres:5432/chess
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  game-server-2:
    build: .
    environment:
      <<: *pvp-common-env
      PVP_SERVER_ID: game-02
      PVP_PORT: 3002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://chess:chess@postgres:5432/chess
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  game-server-3:
    build: .
    environment:
      <<: *pvp-common-env
      PVP_SERVER_ID: game-03
      PVP_PORT: 3003
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://chess:chess@postgres:5432/chess
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  game-server-4:
    build: .
    environment:
      <<: *pvp-common-env
      PVP_SERVER_ID: game-04
      PVP_PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  game-server-5:
    build: .
    environment:
      <<: *pvp-common-env
      PVP_SERVER_ID: game-05
      PVP_PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      game-server-1:
        condition: service_healthy
      game-server-2:
        condition: service_healthy
      game-server-3:
        condition: service_healthy
      game-server-4:
        condition: service_healthy
      game-server-5:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
